[project]
name = "neuro-cnn-classifier"
version = "0.1.0"
description = "Classification multi-classes de tumeurs cérébrales sur IRM"
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
    "matplotlib>=3.9",
    "numpy>=2.0",
    "optuna>=4.0",
    "pandas>=2.2",
    "pillow>=10.4",
    "reportlab>=4.2",
    "scikit-learn>=1.5",
    "seaborn>=0.13",
    "streamlit>=1.39",
    "torch>=2.5",
    "torchvision>=0.20",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = [
    "src/data",
    "src/models",
    "src/training",
    "src/evaluation",
    "src/explainability",
    "src/reporting",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I"]