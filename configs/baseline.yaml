project:
  seed: 42
  image_size: 224        # 512 px pour la plupart des images ; 224 garde les petites tumeurs visibles
  channels: 1            # IRM en niveaux de gris
  val_size: 0.15         # part de Training/ réservée à la validation (callbacks, Optuna)
  class_names:           # ordre alphabétique = ordre des sorties du modèle
    - glioma
    - meningioma
    - notumor
    - pituitary

model:
  filters: 32            # filtres du 1er bloc, doublés à chaque bloc : 32, 64, 128, 256
  dense: 128             # neurones de la couche Dense
  dropout: 0.3

training:
  batch_size: 32
  epochs: 60             # maximum : l'early stopping arrête avant
  learning_rate: 0.001
  weight_decay: 0.0001   # légère régularisation L2 des poids
  patience: 10           # early stopping : epochs sans amélioration de la val_loss
  augment: true
  num_workers: 0

paths:
  raw_data: data/raw
  processed_data: data/processed
  checkpoints: models
  figures: reports/figures
